
<section style="background:#17172b;padding:20px;border-radius:15px;margin-top:25px;color:white">
<h2 style="color:#b58cff;text-align:center">⚔ SHADOW KING ANIME CREATOR</h2>

<h3>Hero Name</h3>
<input id="hero" value="Peter" style="width:100%;padding:12px">

<h3>Anime Name</h3>
<input id="anime" value="SHADOW KING" style="width:100%;padding:12px">

<h3>Story Type</h3>
<select id="type" style="width:100%;padding:12px">
<option>Dark Fantasy</option>
<option>Action</option>
<option>Adventure</option>
<option>Mystery</option>
</select>

<button onclick="makeStory()" style="width:100%;padding:14px;background:#762be9;color:white">
Generate Anime Story
</button>

<pre id="story" style="white-space:pre-wrap;color:#d7c4ff"></pre>

<h3>Episode Number</h3>
<input id="episode" type="number" min="1" value="1" style="width:100%;padding:12px">

<button onclick="makeScenes()" style="width:100%;padding:14px;background:#762be9;color:white">
Generate Anime Scenes
</button>

<pre id="scenes" style="white-space:pre-wrap;color:#d7c4ff"></pre>
</section>

<script>
function makeStory(){
 const hero=document.getElementById("hero").value || "Peter";
 const anime=document.getElementById("anime").value || "SHADOW KING";
 const type=document.getElementById("type").value;

 document.getElementById("story").textContent=
 `${anime}\nGenre: ${type}\n\n`+
 `Episode 1: The Awakening\n\n`+
 `${hero} ek rahasyamayi duniya mein pahunchta hai. `+
 `Wahan use ek ancient shadow power milti hai.\n\n`+
 `${hero}: Ye duniya itni khatarnak kyun hai?\n`+
 `Mysterious Voice: Tumhari asli power abhi jaagi nahi hai.\n\n`+
 `${hero} apni power ko samajhne ke liye ek nayi journey shuru karta hai.\n\n`+
 `To be continued...`;
}

function makeScenes(){
 const hero=document.getElementById("hero").value || "Peter";
 const ep=document.getElementById("episode").value || 1;

 const scenes=[
  "Opening: Dark fantasy kingdom ka cinematic view.",
  `${hero} ek mysterious dungeon mein enter karta hai.`,
  "Ek mysterious shadow system appear hota hai.",
  `${hero} apni hidden power discover karta hai.`,
  "Cliffhanger: Ek mysterious enemy saamne aata hai."
 ];

 document.getElementById("scenes").textContent=
 `EPISODE ${ep}\n\n`+
 scenes.map((s,i)=>`SCENE ${i+1}\n${s}\n`).join("\n");
}
</script>
